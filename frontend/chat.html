<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniFlow AI - Student Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 600px;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            border-radius: 12px 12px 0 12px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-radius: 12px 12px 12px 0;
        }

        .message.system .message-content {
            background: #e8f5e9;
            color: #2e7d32;
            text-align: center;
            width: 100%;
            border-radius: 12px;
            font-size: 13px;
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .login-container h1 {
            margin-bottom: 30px;
            color: #333;
        }

        .login-container input {
            width: 100%;
            margin-bottom: 15px;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script>
        // Simple state management
        let state = {
            isLoggedIn: false,
            token: localStorage.getItem('auth_token'),
            messages: [],
            isLoading: false,
            email: ''
        };

        const API_BASE = 'http://127.0.0.1:8000/api';

        // Restore logged in state if token exists
        if (state.token) {
            state.isLoggedIn = true;
            state.email = localStorage.getItem('user_email');
        }

        function render() {
            const root = document.getElementById('root');
            
            if (!state.isLoggedIn) {
                root.innerHTML = `
                    <div class="login-container">
                        <h1>🎓 UniFlow AI</h1>
                        <p style="margin-bottom: 30px; color: #666;">Student Assistant Portal</p>
                        <input type="email" id="email" placeholder="Email" value="">
                        <input type="password" id="password" placeholder="Password" value="">
                        <button onclick="handleLogin()">Login</button>
                        <p style="margin-top: 20px; font-size: 13px; color: #999;">
                            Demo: student@example.com / password123
                        </p>
                    </div>
                `;
            } else {
                root.innerHTML = `
                    <div class="container">
                        <div class="header">
                            <h1>UniFlow AI Assistant</h1>
                            <p>Hello, ${state.email}</p>
                        </div>
                        <div class="chat-area" id="chatArea">
                            ${state.messages.map(msg => `
                                <div class="message ${msg.role}">
                                    <div class="message-content">${escapeHtml(msg.content)}</div>
                                </div>
                            `).join('')}
                            ${state.isLoading ? `
                                <div class="message system">
                                    <div class="message-content">
                                        <div class="loading"></div>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                        <div class="input-area">
                            <input 
                                type="text" 
                                id="messageInput" 
                                placeholder="Ask me about your transcript, fees, enrollment..."
                                ${state.isLoading ? 'disabled' : ''}
                                onkeypress="if(event.key==='Enter') handleSend()"
                            >
                            <button onclick="handleSend()" ${state.isLoading ? 'disabled' : ''}>Send</button>
                            <button onclick="handleLogout()" style="background: #999;">Logout</button>
                        </div>
                    </div>
                `;
                
                // Auto-scroll to bottom
                setTimeout(() => {
                    const chatArea = document.getElementById('chatArea');
                    if (chatArea) chatArea.scrollTop = chatArea.scrollHeight;
                }, 0);
                
                // Focus input
                setTimeout(() => {
                    const input = document.getElementById('messageInput');
                    if (input && !state.isLoading) input.focus();
                }, 0);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email')?.value || '';
            const password = document.getElementById('password')?.value || '';

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            try {
                // First register if needed
                await fetch(`${API_BASE}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email,
                        password,
                        full_name: email.split('@')[0]
                    })
                }).catch(() => {}); // Ignore if already registered

                // Login
                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: email, password })
                });

                if (!response.ok) throw new Error('Login failed');

                const data = await response.json();
                state.token = data.access_token;
                state.isLoggedIn = true;
                state.email = email;
                state.messages = [{
                    role: 'system',
                    content: `Welcome to UniFlow AI! I'm here to help you with your university needs. Try asking me about transcripts, fees, enrollment, or anything else!`
                }];

                localStorage.setItem('auth_token', state.token);
                localStorage.setItem('user_email', state.email);
                render();
            } catch (error) {
                alert('Login error: ' + error.message);
            }
        }

        async function handleSend() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            state.messages.push({
                role: 'user',
                content: message
            });
            input.value = '';
            state.isLoading = true;
            render();

            try {
                const response = await fetch(`${API_BASE}/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${state.token}`
                    },
                    body: JSON.stringify({ content: message })
                });

                if (!response.ok) throw new Error('Chat request failed');

                const data = await response.json();
                state.messages.push({
                    role: 'assistant',
                    content: data.message
                });
            } catch (error) {
                state.messages.push({
                    role: 'assistant',
                    content: `Error: ${error.message}`
                });
            }

            state.isLoading = false;
            render();
        }

        function handleLogout() {
            state.isLoggedIn = false;
            state.token = null;
            state.email = '';
            state.messages = [];
            localStorage.removeItem('auth_token');
            localStorage.removeItem('user_email');
            render();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initial render
        render();
    </script>
</body>
</html>
